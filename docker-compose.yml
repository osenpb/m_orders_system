services:
  postgres-keycloak:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD_KEYCLOAK}
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-dev
    # El comando --import-realm busca archivos en /opt/keycloak/data/import
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD_KEYCLOAK}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "7080:8080"
    volumes:
      # Mapeamos tu carpeta local donde está el JSON al contenedor
      - ./keycloak-config:/opt/keycloak/data/import
    depends_on:
      - postgres-keycloak

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # crea products_db en el primer arranque (solo si el volumen esta vacio)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # 9092 para contenedores, 29092 para servicios corriendo en el host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  config-server: 
    build: ./config-server
    container_name: config-server
    environment:
      - JAVA_OPTS=-Xms32m -Xmx64m
    ports:
      - "8888:8888"
    depends_on:
      - keycloak

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    environment:
      - JAVA_OPTS=-Xms32m -Xmx64m 
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      - JAVA_OPTS=-Xms32m -Xmx64m
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - eureka-server
  msvc-product:
    build: ./msvc-product
    container_name: msvc-product
    environment:
      - JAVA_OPTS=-Xms32m -Xmx128m
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    ports:
      - "8081:8081"
    depends_on:
      - config-server
      - eureka-server
      - postgres
      - kafka
  msvc-order:
    build: ./msvc-order
    container_name: msvc-order
    environment:
      - JAVA_OPTS=-Xms32m -Xmx128m
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    ports:
      - "8082:8082"
    depends_on:
      - config-server
      - eureka-server
      - postgres
      - kafka

volumes:
  keycloak_pgdata:
  postgres_data:
  kafka_data: